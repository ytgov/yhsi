name: yhsi-production

services:
  app:
    # Replace `build` with `image` to run a build generated via the GitHub workflow.
    build: .
    image: yhsi-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:${HOST_PORT:-3000}"
      BASE_URL: "http://localhost:${HOST_PORT:-3000}"
      AUTH_REDIRECT: "http://localhost:${HOST_PORT:-3000}/login-complete"
      DB_HOST: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASS: &db-password "1m5ecure!"
      DB_NAME: yhsi_production
      DB_TRUST_SERVER_CERTIFICATE: "true"
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2019-gdr3-ubuntu-16.04@sha256:104e105950f9faa14897f702e70c178f813e3d3d4446b176a0c31fdb442bcf7c
    user: root
    environment:
      TZ: "UTC"
      MSSQL_SA_PASSWORD: *db-password
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql/data

volumes:
  db_data:
